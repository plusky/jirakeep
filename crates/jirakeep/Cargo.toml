[package]
name = "jirakeep"
description = "MCP server for Atlassian Jira Cloud with operator-controlled security guards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["jira", "mcp", "llm", "security", "server"]
categories = ["command-line-utilities", "web-programming::http-server"]

# Two bins live here once the gen feature is on; a bare `cargo run -p
# jirakeep` must mean the shipped binary.
default-run = "jirakeep"

[[bin]]
name = "jirakeep"
path = "src/main.rs"

# Dev/packaging asset generator; built only with `--features gen` so the
# shipped `jirakeep` binary never drags in clap_complete/clap_mangen.
[[bin]]
name = "jirakeep-gen"
path = "src/bin/jirakeep-gen.rs"
required-features = ["gen"]

[features]
gen = ["dep:clap_complete", "dep:clap_mangen"]

[lints]
workspace = true

[dependencies]
jirakeep-core = { path = "../jirakeep-core", version = "0.1.0" }

rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.11"
base64 = "0.22"
toml = "1.1"

clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.3", optional = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-util",
    "process",
    "time",
] }
